<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skattejægeren</title>
  <meta name="description" content="Følg milliarderne i dansk ulandsbistand. Projekter, beløb og prioriteter." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark"></span>
        Skattejægeren
      </a>
      <nav class="nav">
        <a href="#/" data-nav="home">Overblik</a>
        <a href="#/projekter" data-nav="projekter">Projekter</a>
        <a href="#/sager" data-nav="sager">Sager</a>
        <a href="#/om" data-nav="om">Om</a>
      </nav>
    </div>
  </header>

  <!-- Stats always in DOM with real defaults (not "—") so they show even if JS/fetch fails -->
  <section class="stats" id="stats" aria-label="Ulandsbistand i tal">
    <div class="stats-inner">
      <div class="stat">
        <p class="stat-label">Ulandsbistand 2026</p>
        <p class="stat-value" id="stat-year" data-value="23214400000">23,2 mia.</p>
        <p class="stat-unit">kroner i år</p>
      </div>
      <div class="stat">
        <p class="stat-label">Seneste 10 år</p>
        <p class="stat-value" id="stat-10" data-value="187150000000">187 mia.</p>
        <p class="stat-unit">kroner ca.</p>
      </div>
      <div class="stat">
        <p class="stat-label">Siden 2015</p>
        <p class="stat-value" id="stat-all" data-value="227600000000">228 mia.</p>
        <p class="stat-unit">kroner ca.</p>
      </div>
      <div class="stat accent">
        <p class="stat-label">Pr. dansker · 2026</p>
        <p class="stat-value" id="stat-per" data-value="3800">3.800</p>
        <p class="stat-unit">kroner ca.</p>
      </div>
    </div>
  </section>

  <main id="app" class="app"></main>

  <footer class="footer">
    <div class="footer-inner">
      <p>Uafhængig · borgerlig research · ikke tilknyttet kilderne</p>
      <p><a href="https://github.com/MattOMadsen/skattejaegeren">GitHub</a></p>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
